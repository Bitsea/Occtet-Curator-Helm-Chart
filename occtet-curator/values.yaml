## @section Global parameters
global:
  ## @param global.namespace Namespace to deploy all resources
  namespace: curator

## @section Image registry
imageRegistry: ghcr.io/heurtematte

## @param imageTag Global image tag override for all services (overrides per-service tags)
imageTag: ""

## @param imagePullPolicy Global imagePullPolicy override for all services (Always, IfNotPresent, Never)
imagePullPolicy: ""

## @section Frontend configuration
frontend:
  enabled: true
  name: frontend
  image:
    repository: occtet-frontend
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  
  ingress:
    enabled: false
    className: "nginx"
    annotations:
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    hosts:
      - host: curator
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: occtet-curator-tls
    #    hosts:
    #      - occtet-curator.local
  
  ## @param frontend.env Environment variables for frontend
  env:
    ## ORT (OSS Review Toolkit) Configuration
    ## @param frontend.env.ortTokenUrl ORT token URL
    ortTokenUrl: ""
    ## @param frontend.env.ortBaseUrl ORT base URL
    ortBaseUrl: ""
    ## @param frontend.env.ortUsername ORT username
    ortUsername: ""
    ## @param frontend.env.ortPassword ORT password (use existingSecret instead)
    ortPassword: ""
    ## @param frontend.env.ortClientId ORT client ID for authentication
    ortClientId: ""
    
    ## Keycloak Configuration
    ## @param frontend.env.keycloakIssuerUri Keycloak issuer URI
    keycloakIssuerUri: ""
    ## @param frontend.env.keycloakClientId Keycloak client ID
    keycloakClientId: ""
    ## @param frontend.env.keycloakClientSecret Keycloak client secret (use existingSecret instead)
    keycloakClientSecret: ""
    
    ## Frontend Configuration
    ## @param frontend.env.frontendBaseUrl Frontend base URL
    frontendBaseUrl: "http://localhost:8090"
    
    ## HTTPS CA Certificates
    ## @param frontend.env.httpsCaCertPath Path to HTTPS CA certificates
    httpsCaCertPath: "/cacerts"
  
    ## @param frontend.env.springProfilesActive Spring profiles to activate (e.g. "live" or "live,oidc" to enable OIDC)
    springProfilesActive: "live"

    ## @param frontend.env.javaOpts JVM options passed to the frontend through JAVA_OPTS
    ## Without them the JVM only uses 25% of the container memory limit as max heap.
    ## ExitOnOutOfMemoryError lets Kubernetes restart the pod instead of keeping a broken JVM alive.
    javaOpts: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"

  ## @param frontend.existingSecret Name of existing secret for sensitive env vars
  ## Secret must contain: ort-password, keycloak-client-secret
  ## Secret is created by: make secrets-create
  existingSecret: "occtet-curator-secrets"
  
  ## @param frontend.caCerts CA certificates configuration
  caCerts:
    ## @param frontend.caCerts.existingSecret Name of existing secret containing CA certificates
    existingSecret: ""
    ## @param frontend.caCerts.existingConfigMap Name of existing ConfigMap containing CA certificates
    existingConfigMap: ""
  
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi
  
  volumeMounts:
    - name: project-data
      mountPath: /project_data
    - name: cacerts
      mountPath: /cacerts
      readOnly: true

