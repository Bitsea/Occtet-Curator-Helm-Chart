## @section PostgreSQL configuration (using cloudpirates chart with pgvector)
postgresql:
  enabled: true
  
  ## CloudPirates PostgreSQL specific configuration
  image:
    registry: docker.io
    repository: pgvector/pgvector
    tag: pg17-trixie
  
  auth:
    ## Superuser is 'postgres' (default) — credentials from existingSecret
    ## @param postgresql.auth.existingSecret Name of existing secret containing all credentials
    ## The secret must contain key: postgres-password (for the postgres superuser)
    existingSecret: "occtet-curator-secrets"

  ## @section customUser — non-superuser app account created at initdb
  ## Creates user + database from keys in existingSecret
  customUser:
    existingSecret: "occtet-curator-secrets"
    secretKeys:
      name: "username"           # → "curator"
      password: "postgres-password"
      database: "database"       # → "curator"

  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

  initdb:
    ## ConfigMap created by occtet-curator chart containing 01-init-db.sql
    scriptsConfigMap: "{{ .Release.Name }}-postgresql-init"

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

  extraEnvVars:
    - name: POSTGRESQL_MAX_CONNECTIONS
      value: "200"

  service:
    type: ClusterIP
    ports:
      postgresql: 5432

## @section NATS configuration
nats:
  enabled: true
  name: nats
  image:
    repository: nats
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  jetstream:
    enabled: true
    storeDir: /data/jetstream
    maxMemory: 512M
    maxFile: 10G
    domain: bitsea
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  
  service:
    type: ClusterIP
    ports:
      client: 4222
      monitoring: 8222
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

## @section Ollama configuration
ollama:
  enabled: true
  name: ollama
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 11434
    targetPort: 11434
  
  ## @param ollama.model Ollama model to use for AI services
  model: "qwen3:8b"
  
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 4Gi

## @section NFS Provisioner configuration
## Uses nfs-ganesha-server-and-external-provisioner (kubernetes-sigs) for ReadWriteMany
## Deploys NFS Ganesha + a dynamic provisioner — no manual PV management required
nfsprovisioner:
  enabled: true
  persistence:
    enabled: true
    ## StorageClass for the backing RWO PVC (leave empty for cluster default)
    storageClass: ""
    size: 100Gi
    accessMode: ReadWriteOnce
  storageClass:
    ## Name of the StorageClass created by the provisioner
    name: nfs
    create: true
    defaultClass: false
    reclaimPolicy: Retain
    allowVolumeExpansion: true
    mountOptions:
      - vers=4.1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

## @section Persistence configuration
persistence:
  projectData:
    enabled: true
    size: 90Gi # should be lower than nfsprovisioner.persistence.size to ensure it fits on the NFS volume
    ## AccessMode for the shared project data PVC — must be ReadWriteMany
    accessMode: ReadWriteMany
    ## StorageClass used only when nfsProvisioner.enabled is false
    ## Leave empty to use the cluster default StorageClass
    storageClass: ""
    ## Mount path inside application containers
    mountPath: "/project_data"

## @section Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

## @section Pod Security
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: false
  runAsUser: 1000

## @section Node selector and affinity
nodeSelector: {}

tolerations: []

affinity: {}
