{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "occtet-curator.frontend.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "occtet-curator.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "occtet-curator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "occtet-curator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- with .Values.serviceAccount }}
      serviceAccountName: {{ include "occtet-curator.serviceAccountName" $ }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: wait-for-postgresql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "occtet-curator.postgresql.fullname" . }} {{ .Values.postgresql.service.ports.postgresql }}; do echo "Waiting for PostgreSQL..."; sleep 3; done; echo "PostgreSQL is ready"']
      - name: wait-for-nats
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "occtet-curator.nats.fullname" . }} {{ .Values.nats.service.ports.client }}; do echo "Waiting for NATS..."; sleep 3; done; echo "NATS is ready"']
      containers:
      - name: frontend
        image: "{{ .Values.imageRegistry }}/{{ .Values.frontend.image.repository }}:{{ .Values.imageTag | default .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy | default .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.service.targetPort }}
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: {{ .Values.frontend.env.springProfilesActive | quote }}
        {{- if .Values.frontend.env.javaOpts }}
        - name: JAVA_OPTS
          value: {{ .Values.frontend.env.javaOpts | quote }}
        {{- end }}
        - name: DB_URL
          value: "jdbc:postgresql://{{ include "occtet-curator.postgresql.fullname" . }}:{{ .Values.postgresql.service.ports.postgresql }}/{{ .Values.postgresql.auth.database }}"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: postgres-password
        - name: NATS_URL
          value: "nats://{{ include "occtet-curator.nats.fullname" . }}:{{ .Values.nats.service.ports.client }}"
        {{- if .Values.frontend.env.ortTokenUrl }}
        - name: ORT_TOKEN_URL
          value: {{ .Values.frontend.env.ortTokenUrl | quote }}
        {{- end }}
        {{- if .Values.frontend.env.ortBaseUrl }}
        - name: ORT_BASE_URL
          value: {{ .Values.frontend.env.ortBaseUrl | quote }}
        {{- end }}
        {{- if .Values.frontend.env.ortClientId }}
        - name: ORT_CLIENT_ID
          value: {{ .Values.frontend.env.ortClientId | quote }}
        {{- end }}
        {{- if .Values.frontend.existingSecret }}
        - name: ORT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: ort-username
        {{- else if .Values.frontend.env.ortUsername }}
        - name: ORT_USERNAME
          value: {{ .Values.frontend.env.ortUsername | quote }}
        {{- end }}
        {{- if .Values.frontend.existingSecret }}
        - name: ORT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: ort-password
        {{- else if .Values.frontend.env.ortPassword }}
        - name: ORT_PASSWORD
          value: {{ .Values.frontend.env.ortPassword | quote }}
        {{- end }}
        {{- if .Values.frontend.existingSecret }}
        - name: ORT_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: keycloak-client-secret
        {{- end }}
        {{- if .Values.frontend.env.keycloakIssuerUri }}
        - name: KEYCLOAK_ISSUER_URI
          value: {{ .Values.frontend.env.keycloakIssuerUri | quote }}
        {{- end }}
        {{- if .Values.frontend.existingSecret }}
        - name: KEYCLOAK_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: keycloak-client-id
        {{- else if .Values.frontend.env.keycloakClientId }}
        - name: KEYCLOAK_CLIENT_ID
          value: {{ .Values.frontend.env.keycloakClientId | quote }}
        {{- end }}
        {{- if .Values.frontend.existingSecret }}
        - name: KEYCLOAK_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.frontend.existingSecret }}
              key: keycloak-client-secret
        {{- else if .Values.frontend.env.keycloakClientSecret }}
        - name: KEYCLOAK_CLIENT_SECRET
          value: {{ .Values.frontend.env.keycloakClientSecret | quote }}
        {{- end }}
        {{- if .Values.frontend.env.frontendBaseUrl }}
        - name: FRONTEND_BASE_URL
          value: {{ .Values.frontend.env.frontendBaseUrl | quote }}
        {{- end }}
        {{- if .Values.frontend.env.httpsCaCertPath }}
        - name: HTTPS_CA_CERT_PATH
          value: {{ .Values.frontend.env.httpsCaCertPath | quote }}
        {{- end }}
        - name: PROJECT_DATA_PATH
          value: {{ .Values.persistence.projectData.mountPath | quote }}
        volumeMounts:
        {{- with .Values.frontend.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
      volumes:
      - name: project-data
        {{- if .Values.persistence.projectData.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "occtet-curator.fullname" . }}-project-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: cacerts
        {{- if .Values.frontend.caCerts.existingSecret }}
        secret:
          secretName: {{ .Values.frontend.caCerts.existingSecret }}
          optional: true
        {{- else if .Values.frontend.caCerts.existingConfigMap }}
        configMap:
          name: {{ .Values.frontend.caCerts.existingConfigMap }}
          optional: true
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
